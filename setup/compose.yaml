# Morning Star — Docker Compose
#
# Local (Next reste sur l'hôte, port 3000 — aucune image d'application) :
#   docker compose --env-file ../.env up -d
#
# Production / CI (application + base, build de l'image, port 4004) :
#   docker compose --env-file ../.env --profile production up -d --build

name: morning-star

networks:
  morning-star-network:
    name: morning-star-network
    driver: bridge

volumes:
  morning-star-db-data:

services:
  db:
    image: postgres:16-alpine
    container_name: morning-stard
    restart: unless-stopped
    networks:
      - morning-star-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-morning-star-db}
      POSTGRES_USER: ${POSTGRES_USER:-morningstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-morningstar_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - morning-star-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-morningstar} -d ${POSTGRES_DB:-morning-star-db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ["production"]
    image: morning-star:production
    container_name: morning-star
    build:
      context: ..
      dockerfile: setup/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL_PRODUCTION:-http://localhost:4004}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Morning Star}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - morning-star-network
    environment:
      NODE_ENV: production
      PORT: "4004"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL_PRODUCTION:-http://localhost:4004}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Morning Star}
      DATA_SOURCE: ${DATA_SOURCE:-mock}
      DATABASE_URL: postgresql://${POSTGRES_USER:-morningstar}:${POSTGRES_PASSWORD:-morningstar_local}@morning-stard:5432/${POSTGRES_DB:-morning-star-db}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@morning-star.local}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
    ports:
      - "4004:4004"
